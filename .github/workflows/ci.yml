name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: support_attachment_test_ci
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d support_attachment_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: 1.94.0
          components: rustfmt,clippy
      - name: Install repository-boundary tools
        run: sudo apt-get update && sudo apt-get install --yes jq ripgrep
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace --all-targets --all-features
      - run: cargo test --locked --workspace --all-targets
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Install exact contract projection checker
        run: >-
          cargo install --locked
          --git https://github.com/LioRael/lenso-protocols
          --rev 9d2774c767fd64a6cc63a5ac04360e9cb92816da
          lenso-contract-codegen
      - run: lenso-contract-codegen workspace check --manifest-path Cargo.toml
      - run: ./scripts/check-repository-boundary.sh
      - name: PostgreSQL durable attachment acceptance
        env:
          LENSO_SUPPORT_ATTACHMENT_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/support_attachment_test_ci
        run: >-
          cargo test --locked -p lenso-support-attachment-postgres-plugin
          --features postgres-acceptance postgres_tests::
          -- --nocapture --test-threads=1
