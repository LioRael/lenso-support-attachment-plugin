[workspace]
resolver = "2"
members = [
    "crates/lenso-capability-support-attachment",
    "crates/lenso-support-attachment-postgres-plugin",
]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/LioRael/lenso-support-attachment-plugin"
rust-version = "1.94"

[workspace.dependencies]
base64 = "0.22"
futures = "0.3"
lenso = "0.5.0"
lenso-app-plan = "0.3.0"
lenso-auth-sdk = "0.2.1"
lenso-capability-content-vault = "0.1.0"
lenso-capability-secrets = "0.1.2"
lenso-capability-support-case-authorization = "0.1.0"
lenso-contract-runtime = "0.1.3"
lenso-kernel = "0.2.0"
lenso-native-adapter = "0.3.0"
lenso-plugin-authoring = "0.1.1"
lenso-postgres-kit = "0.1.0"
lenso-runner = "0.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "time", "uuid"] }
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.52", features = ["macros", "rt"] }
uuid = { version = "1.19", features = ["serde", "v7"] }
url = "2.5"
zeroize = "1.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
